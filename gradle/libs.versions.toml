[versions]
agp = "9.4.1"
java = "21"
kotlin = "2.4.21"
detekt = "2.0.0-alpha.6"
detektComposeRules = "0.6.8"
androidxActivityCompose = "1.13.0"
composeMultiplatform = "1.13.0-alpha02"
composeMaterial3 = "1.10.0-alpha05"
composeMaterialIconsExtended = "1.7.3"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"
ktor = "3.6.0"
datastore = "1.2.1"
koin = "4.2.2"
navigation3 = "1.1.2"
lifecycle = "2.11.0"
composableScanner = "0.9.3"
junit = "4.13.2"
junitVintage = "6.1.3"
roborazzi = "1.76.0"
kotest = "6.2.5"
kover = "0.9.11"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-compose-viewmodel-navigation = { group = "io.insert-koin", name = "koin-compose-viewmodel-navigation", version.ref = "koin" }
lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
